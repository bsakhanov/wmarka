PLG_SYSTEM_WMARKAOG="System - Social cards (Wmarka)"
PLG_SYSTEM_WMARKAOG_XML_DESCRIPTION="Fixes article cards in social networks and NewsArticle markup when Joomla cache is on: article pages are not cached so the layout always runs. Adds size, type and alt to og:image."
PLG_SYSTEM_WMARKAOG_BYPASS="Joomla cache for guests"
PLG_SYSTEM_WMARKAOG_BYPASS_DESC="With Joomla cache on, a cache hit makes the template lose article data: guests and crawlers get og:type=website, the default image and no NewsArticle. Mode “article pages” turns the cache off for the duration of an article request; mode “all pages” does the same for every site page (then the built-in Joomla cache for guests is effectively off: use System - Page Cache for speed)."
PLG_SYSTEM_WMARKAOG_BYPASS_0="Do not interfere"
PLG_SYSTEM_WMARKAOG_BYPASS_1="Do not cache article pages (default)"
PLG_SYSTEM_WMARKAOG_BYPASS_2="Do not cache any site page"
PLG_SYSTEM_WMARKAOG_EXTRAS="Extend og:image"
PLG_SYSTEM_WMARKAOG_EXTRAS_DESC="Adds og:image:width, og:image:height, og:image:type, og:image:alt and twitter:image:alt."
PLG_SYSTEM_WMARKAOG_HEADER="X-Wmarkaog header"
PLG_SYSTEM_WMARKAOG_HEADER_DESC="Shows in the response that the plugin ran: “article; cache=off” on an article page. Check with curl -sI article_url."

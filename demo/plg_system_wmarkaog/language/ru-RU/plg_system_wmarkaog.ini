PLG_SYSTEM_WMARKAOG="Система — Карточки для соцсетей (Wmarka)"
PLG_SYSTEM_WMARKAOG_XML_DESCRIPTION="Чинит карточки статей в соцсетях и разметку NewsArticle при включённом кеше Joomla: страница материала не кешируется, макет исполняется всегда. Добавляет к og:image размеры, тип и подпись."
PLG_SYSTEM_WMARKAOG_BYPASS="Кеш Joomla для гостей"
PLG_SYSTEM_WMARKAOG_BYPASS_DESC="Если в «Системе → Общих настройках → Кеш» кеш включён, при выдаче из кеша шаблон теряет данные статьи: гости и краулеры получают og:type=website, общую картинку и страницу без NewsArticle. Режим «страницы материалов» выключает кеш на время запроса материала; режим «все страницы» делает то же для всех страниц сайта (тогда встроенный кеш Joomla для гостей, по сути, не работает: для скорости включите «Система — Кеш страниц»)."
PLG_SYSTEM_WMARKAOG_BYPASS_0="Не вмешиваться"
PLG_SYSTEM_WMARKAOG_BYPASS_1="Не кешировать страницы материалов (по умолчанию)"
PLG_SYSTEM_WMARKAOG_BYPASS_2="Не кешировать все страницы сайта"
PLG_SYSTEM_WMARKAOG_EXTRAS="Дополнить og:image"
PLG_SYSTEM_WMARKAOG_EXTRAS_DESC="Добавляет og:image:width, og:image:height, og:image:type, og:image:alt и twitter:image:alt."
PLG_SYSTEM_WMARKAOG_HEADER="Заголовок X-Wmarkaog"
PLG_SYSTEM_WMARKAOG_HEADER_DESC="Показывает в ответе, что плагин сработал: «article; cache=off» на странице материала. Проверка — curl -sI адрес_материала."
